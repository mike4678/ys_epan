<html>
<head>
    <title></title>
    <style type="text/css">
        body    {background-color:#FFFFE6;font-size:9pt;border:0px;padding:5px;margin:0;font-family: 宋体, Century Gothic, Arial, Helvetica;}
         p	    {margin:0px;line-height:120%;}
        .sjtb         {border:1px solid #BDB76B;border-collapse: collapse;width:100%;font-size:9pt;}
        .sjtb td      {border:1px solid #BDB76B;}
        .sjtb tr.trbt{background-color:#EEE8AA;color:#000;}
        label   {color:Green;margin-right:5px;font-weight:bold;}
        span    {color:Red;margin-right:5px;font-weight:bold;}
        td{font:9pt;line-height:150%;}
        
    </style>
    <script language="javascript" type="text/javascript">
        ckid = "D_qxsm";
        //禁右
        //document.oncontextmenu = function() { return false; }
        //document.ondragstart = function() { return false; }
        function onloads() { csdy(); }
        function csdy() {
            parent._C.bt(ckid, "目录权限说明");
            $("tmc").innerHTML = parent._CK.qxsm.o.parentNode.childNodes[2].innerHTML;
            $("tnr").innerHTML = "";
            $("tsm").innerHTML = "";
            var mlbh = parent._m.qdmlbh(parent._CK.qxsm.o);
            var M = new parent.ML(mlbh);

            var s = "";
            if (M.mmcd == 0) {
                s = zck(true) + zsc(parent.dxksc) + zxz(true);
                $("tnr").innerHTML = s;
                $("tsm").innerHTML = "此目录没有设置密码，访客上传权限受管理员在后台设置限制。";
                return;
            }

            if (M.sx.substr(0, 3) == "000" && M.sx.substr(3) != "000") {
                s = zck(M.sx.substr(3, 1) == "1");
                s += zsc(M.sx.substr(4, 1) == "1");
                s += zxz(M.sx.substr(5, 1) == "1");
                $("tnr").innerHTML = s;
                $("tsm").innerHTML = "目录设置了密码，允许访客直接以放弃认证方式开启。";
                return;
            }
            if (M.sx.substr(0, 3) != "000" && M.sx.substr(3) == "000") {
                s = "<p><b>访客经过目录密码认证后：</b></p>";
                s += zsc(M.sx.substr(1, 1) == "1");
                s += zxz(M.sx.substr(2, 1) == "1");
                s += zgl(M.sx.substr(0, 1) == "1");
                $("tnr").innerHTML = s;
                $("tsm").innerHTML = "目录设置了密码，用户需输入密码才能开启目录。";
                return;
            }
            s = "<p><b>经过密码认证后权限:</b></p>";
            s += "<p>";
            s += zsc(M.sx.substr(1, 1) == "1");
            s += zxz(M.sx.substr(2, 1) == "1");
            s += zgl(M.sx.substr(0, 1) == "1");
            s += "</p><p><b>放弃认证后权限:</b></p><p>"
            s += zck(M.sx.substr(3, 1) == "1");
            s += zsc(M.sx.substr(4, 1) == "1");
            s += zxz(M.sx.substr(5, 1) == "1");
            s += "</p>";
            $("tnr").innerHTML = s;
            $("tsm").innerHTML = "目录设置了密码，用户可以认证开启目录，也可以以放弃认证的方式开启目录。";
        }
       
       
       
        function zck(pd) { return (pd) ? "<label>可以查看</label>" : "<span>禁止查看</span>"; }
        function zsc(pd) { return (pd) ? "<label>可以上传</label>" : "<span>禁止上传</span>"; }
        function zxz(pd) { return (pd) ? "<label>可以下载</label>" : "<span>禁止下载</span>"; }
        function zgl(pd) { return (pd) ? "<label>可以管理</label>" : "<span>禁止管理</span>"; }
        
        function $p(rid) { return parent.document.getElementById(rid) }
        function $(rid) { return document.getElementById(rid); }
    </script>
</head>
<body onmousedown ="parent._C.zd(ckid);" onLoad="onloads();">
        <table class="sjtb">
        <tr><td style="width:60px;">目录名称:</td><td id="tmc"></td></tr>
        <tr><td>权限:</td><td id="tnr">
        </td></tr>
        <tr><td>说明:</td><td id="tsm"></td></tr>
        
        </table>
        <p style="margin-top:10px;">注：管理员在管理区登录后不受此权限限制。</p>
        <p align="center" style="margin:5px;"><input type="button" value="关闭" onClick="parent.$(ckid).style.display = 'none'"/></p>
</body>
</html>
