<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>403 - 访问被拒绝</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f6f8;text-align:center;padding:80px 20px;color:#333;}
.wrap{max-width:480px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:48px 32px;}
.code{font-size:64px;font-weight:bold;color:#e74c3c;line-height:1;}
.msg{font-size:18px;margin:16px 0 8px;}
.sub{font-size:13px;color:#888;line-height:1.8;}
a{color:#5e72e4;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
<div class="code">403</div>
<div class="msg">访问被拒绝</div>
<div class="sub">您没有权限访问该资源，或该资源受系统安全策略保护。<br>如需帮助，请联系网站管理员。</div>
</div>
</body>
</html>
